<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فجر — الوادي</title>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
       background:#10151d;color:#e8e2d4;margin:0;min-height:100vh;
       display:flex;align-items:center;justify-content:center;text-align:center}
  .card{padding:24px;max-width:360px}
  h1{font-size:20px;font-weight:600;margin:0 0 8px}
  p{color:#a9b2a4;font-size:14px;line-height:1.8}
  a{color:#d9a75e;font-size:15px}
  .spin{width:34px;height:34px;border:3px solid #2c3644;border-top-color:#b98a4a;
        border-radius:50%;margin:18px auto;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>وادي فجر</h1>
  <div class="spin"></div>
  <p id="msg">جارٍ الوصول إلى فجر…</p>
  <p id="sub" style="font-size:13px">قد يستغرق هذا بضع ثوانٍ — لا تغلق الصفحة، سنأخذك إليها تلقائيًا.</p>
  <p><a id="manual" href="#" style="display:none">المحاولة المباشرة</a></p>
</div>
<script>
  // Self-healing door: fetch the pointer (cache-busted), probe the
  // target before redirecting, and if it does not answer, wait and
  // try again with a FRESH pointer — a tunnel rotation heals itself
  // here without the visitor doing anything.
  var lastUrl = null;
  var startedAt = Date.now();

  function fetchPointer() {
    return fetch('pointer.json?t=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('pointer'); return r.json(); })
      .then(function(d){ return (d && d.url) ? d : null; })
      .catch(function(){ return null; });
  }

  function probe(url) {
    // no-cors: an opaque response means the host answered *something*
    // (gate health, PIN page, serveo notice). A dead hostname rejects.
    return new Promise(function(resolve){
      var ctl = new AbortController();
      var to = setTimeout(function(){ ctl.abort(); }, 7000);
      fetch(url + '/__health', {mode: 'no-cors', cache: 'no-store', signal: ctl.signal})
        .then(function(){ clearTimeout(to); resolve(true); })
        .catch(function(){ clearTimeout(to); resolve(false); });
    });
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function attempt() {
    fetchPointer().then(function(d){
      if (d && d.url) {
        lastUrl = d.url;
        var a = document.getElementById('manual');
        a.href = d.url; a.style.display = 'inline';
        return probe(d.url).then(function(alive){
          if (alive) {
            document.getElementById('msg').textContent = 'وجدنا فجر — نأخذك إليها الآن…';
            location.replace(d.url);
            return 'done';
          }
          return 'retry';
        });
      }
      return 'retry';
    }).then(function(res){
      if (res === 'done') return;
      if (Date.now() - startedAt > 120000) {
        document.getElementById('msg').textContent =
          'جارٍ الوصول إلى فجر… الوادي بعيد قليلًا الآن، ما زلنا نحاول.';
      }
      return wait(4000).then(attempt);
    });
  }
  attempt();
</script>
</body>
</html>
