<!DOCTYPE html>
<!-- door v3: verified-gate probe (CORS /__health, ok-body, twice) -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فجر — الوادي</title>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
       background:#10151d;color:#e8e2d4;margin:0;min-height:100vh;
       display:flex;align-items:center;justify-content:center;text-align:center}
  .card{padding:24px;max-width:360px}
  h1{font-size:20px;font-weight:600;margin:0 0 8px}
  p{color:#a9b2a4;font-size:14px;line-height:1.8}
  a{color:#d9a75e;font-size:15px}
  .spin{width:34px;height:34px;border:3px solid #2c3644;border-top-color:#b98a4a;
        border-radius:50%;margin:18px auto;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>وادي فجر</h1>
  <div class="spin"></div>
  <p id="msg">جارٍ الوصول إلى فجر…</p>
  <p id="sub" style="font-size:13px">قد يستغرق هذا بضع ثوانٍ — لا تغلق الصفحة، سنأخذك إليها تلقائيًا.</p>
  <p><a id="manual" href="#" style="display:none">المحاولة المباشرة</a></p>
</div>
<script>
  // Self-healing door v3.
  // Fetch the pointer (cache-busted), then PROVE the target is really
  // Fajr's gate before redirecting: a CORS fetch of <url>/__health
  // must return the gate's own {"ok": true} body — twice in a row.
  // A dead serveo hostname rejects; a serveo notice/error page fails
  // CORS or the body check. On any failure: wait, re-fetch a FRESH
  // pointer, try again — a tunnel rotation heals itself here.
  var startedAt = Date.now();

  function fetchPointer() {
    return fetch('pointer.json?t=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('pointer'); return r.json(); })
      .then(function(d){ return (d && d.url) ? d : null; })
      .catch(function(){ return null; });
  }

  function probeGate(url) {
    return new Promise(function(resolve){
      var ctl = new AbortController();
      var to = setTimeout(function(){ ctl.abort(); }, 6000);
      fetch(url + '/__health', {mode: 'cors', cache: 'no-store', signal: ctl.signal})
        .then(function(r){ return r.text().then(function(t){
          clearTimeout(to);
          resolve(r.status === 200 && t.indexOf('"ok": true') !== -1);
        }); })
        .catch(function(){ clearTimeout(to); resolve(false); });
    });
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function attempt() {
    fetchPointer().then(function(d){
      if (!d || !d.url) return 'retry';
      var a = document.getElementById('manual');
      a.href = d.url; a.style.display = 'inline';
      return probeGate(d.url).then(function(first){
        if (!first) return 'retry';
        return wait(2500).then(function(){
          // re-check the pointer: if it rotated during the wait, the
          // fresh target is the one to verify, not the stale one.
          return fetchPointer().then(function(d2){
            var target = (d2 && d2.url) ? d2.url : d.url;
            return probeGate(target).then(function(second){
              if (!second) return 'retry';
              document.getElementById('msg').textContent =
                'وجدنا فجر — نأخذك إليها الآن…';
              location.replace(target);
              return 'done';
            });
          });
        });
      });
    }).then(function(res){
      if (res === 'done') return;
      if (Date.now() - startedAt > 120000) {
        document.getElementById('msg').textContent =
          'جارٍ الوصول إلى فجر… الوادي بعيد قليلًا الآن، ما زلنا نحاول.';
      }
      return wait(3500).then(attempt);
    });
  }
  attempt();
</script>
</body>
</html>
